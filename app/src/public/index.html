<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON HOOPS 2.0</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Impact', sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Power Meter */
        #power-container {
            position: absolute;
            top: 50%;
            right: 50px;
            width: 30px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            border-radius: 15px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column-reverse;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        #power-fill {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #00ff00, #ffff00, #ff0000);
            border-radius: 13px;
            transition: height 0.05s;
        }

        #power-label {
            position: absolute;
            bottom: -30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Scoreboard */
        #scoreboard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 50px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border: 4px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ff00;
        }

        .score-box {
            text-align: center;
        }

        .score-label {
            color: #888;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .score-val {
            color: #00ff00;
            font-size: 4rem;
            text-shadow: 0 0 10px #00ff00;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        #timer-val {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        #instructions {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: #fff;
            opacity: 0.6;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #000;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="power-container">
        <div id="power-fill"></div>
        <div id="power-label">POWER</div>
    </div>

    <div id="scoreboard">
        <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-val" id="score">00</div>
        </div>
        <div class="score-box">
            <div class="score-label">TIME</div>
            <div class="score-val" id="timer-val">60</div>
        </div>
    </div>

    <div id="instructions">HOLD [UP] TO CHARGE • RELEASE TO SHOOT</div>

    <script type="module" src="script.js"></script>
</body>

</html>
