<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON HOOPS 2.0</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Impact', sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Power Meter */
        #power-container {
            position: absolute;
            top: 50%;
            right: 50px;
            width: 30px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            border-radius: 15px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column-reverse;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        #power-fill {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #00ff00, #ffff00, #ff0000);
            border-radius: 13px;
            transition: height 0.05s;
        }

        #power-label {
            position: absolute;
            bottom: -30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Scoreboard */
        #scoreboard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 50px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border: 4px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ff00;
        }

        .score-box {
            text-align: center;
        }

        .score-label {
            color: #888;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .score-val {
            color: #00ff00;
            font-size: 4rem;
            text-shadow: 0 0 10px #00ff00;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        #timer-val {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        #instructions {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: #fff;
            opacity: 0.6;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #000;
        }

        /* Overlays */
        #overlays {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            z-index: 100;
        }

        .modal {
            background: #111;
            padding: 40px;
            border: 4px solid #00ff00;
            border-radius: 20px;
            box-shadow: 0 0 30px #00ff00;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        .modal input {
            width: 80%;
            padding: 15px;
            font-size: 1.5rem;
            background: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .btn {
            background: #00ff00;
            color: #000;
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 0 10px #00ff00;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* Leaderboard */
        #leaderboard {
            margin-top: 20px;
            width: 100%;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #333;
            font-family: 'Courier New', monospace;
        }

        .lb-name {
            color: #fff;
        }

        .lb-score {
            color: #00ff00;
        }

        /* In-Game Leaderboard */
        #mini-leaderboard {
            position: absolute;
            top: 150px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            width: 180px;
            z-index: 50;
            display: none;
            /* Hidden until game starts */
        }

        .mini-lb-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
        }

        #target-val {
            color: #ff0055;
            font-size: 2rem;
            text-shadow: 0 0 10px #ff0055;
            font-weight: bold;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>

<body>
    <div id="canvas-container"></div>

    <!-- UI Elements -->
    <div id="mini-leaderboard">
        <div style="color: #888; font-size: 0.8rem; margin-bottom: 10px; text-align: center;">TOP 3</div>
        <div id="mini-lb-list"></div>
    </div>

    <div id="power-container">
        <div id="power-fill"></div>
        <div id="power-label">POWER</div>
    </div>

    <div id="scoreboard">
        <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-val" id="score">00</div>
        </div>
        <div class="score-box">
            <div class="score-label">TIME</div>
            <div class="score-val" id="timer-val">60</div>
        </div>
    </div>

    <div id="instructions">HOLD [UP] TO CHARGE • RELEASE TO SHOOOT</div>

    <div id="overlays">
        <!-- Start Screen -->
        <div id="start-screen" class="modal">
            <h2>NEON HOOPS</h2>
            <input type="text" id="player-name" placeholder="ENTER NAME" maxlength="15">
            <br>
            <button id="start-btn" class="btn">PLAY NOW</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="modal" style="display: none;">
            <h2>GAME OVER</h2>
            <div style="font-size: 2rem; margin-bottom: 20px;">SCORE: <span id="final-score"
                    style="color: #00ff00;">0</span></div>
            <button id="restart-btn" class="btn">TRY AGAIN</button>

            <div id="leaderboard">
                <div style="color: #888; font-size: 0.8rem; margin: 20px 0 10px;">TOP PLAYERS</div>
                <div id="leaderboard-list">
                    <!-- Loaded via JS -->
                </div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="modal" style="display: none;">
            <h2>PAUSED</h2>
            <p style="color: #888; margin-bottom: 30px;">PRESS [ESC] TO RESUME</p>
            <button id="resume-btn" class="btn">RESUME</button>
            <br><br>
            <button id="pause-restart-btn" class="btn"
                style="background: transparent; border: 2px solid #00ff00; color: #00ff00;">RESTART</button>
        </div>
    </div>


    <script type="module" src="script.js?v=2"></script>
</body>

</html>
