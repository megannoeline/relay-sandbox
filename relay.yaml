project: sandbox

containers:
  - name: app
    dockerfile: app/Dockerfile
  
  - name: db
    dockerfile: db/Dockerfile
    env:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: toy_db

services:
  - name: app
    container: app
    ports:
      - name: http
        port: 3000
    env:
      DATABASE_URL: postgres://user:password@sandbox-db.hostbo.cx:5434/toy_db
  
  - name: db
    container: db
    ports:
      - name: pg
        port: 5432

deploys:
  - name: dev
    services:
      - service: app
        host: sandbox.hostbo.cx
        port: 443
        target: http
      - service: db
        host: sandbox-db.hostbo.cx
        port: 5434
        target: pg
