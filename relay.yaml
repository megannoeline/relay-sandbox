project: sandbox

containers:
  - name: app
    dockerfile: app/Dockerfile
  
  - name: db
    dockerfile: db/Dockerfile
    env:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: toy_db

services:
  - name: app
    container: app
    ports:
      - name: http
        port: 3000
    env:
      # efficient-dispatch: relay usually runs containers on a bridge or host.
      # For a single worker, we'll try 'localhost' assuming host networking or simple port mapping.
      # If they are isolated, we might need to rely on Docker DNS or IP.
      DATABASE_URL: postgres://user:password@localhost:5434/toy_db
  
  - name: db
    container: db
    ports:
      - name: pg
        port: 5432

deploys:
  - name: dev
    services:
      - service: app
        host: sandbox.local
        port: 3001
        target: http
      - service: db
        host: sandbox-db.local
        port: 5434
        target: pg
